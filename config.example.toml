# 网盘自动上传 配置模板
# 用法：复制为 config.toml 后按注释填写；config.toml 不入库（.gitignore 已忽略）。
# 必填项缺失时启动会一次性列出全部缺失清单。

[pan]
# 各网盘默认上传目录（CLI 未指定 --dir 时使用）
baidu_default_dir = "/来自电脑"
quark_default_dir = "/来自电脑"

[watch]
# 监控目录与目标映射。每项：local = 本地目录，pan = 网盘名（baidu / quark），remote_dir = 网盘目标目录
# 示例：dirs = [{ local = "D:\\Drop", pan = "quark", remote_dir = "/同步" }]
dirs = []
# 轮询间隔（秒）
interval_seconds = 5
# 新文件稳定判定等待（秒）：两次采样大小不变即认为写完
stable_seconds = 10
# 单文件失败重试上限
retry_limit = 3

[feishu]
# 飞书自建应用与目标文档（I-005 使用；app_secret 放 secrets/feishu_app.json，不写在这里）
app_id = ""
doc_token = ""

[log]
# 日志目录与保留天数
dir = "logs"
retention_days = 30
