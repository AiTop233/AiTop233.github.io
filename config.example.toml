# 网盘自动上传 配置模板
# 用法：复制为 config.toml 后按注释填写；config.toml 不入库（.gitignore 已忽略）。
# 必填项缺失时启动会一次性列出全部缺失清单。

[pan]
# 各网盘默认上传目录（CLI 未指定 --dir、网页表单目录留空时使用）
# 注意：开了「按日期建子目录」时，这里要在末尾自动拼 年/月/日，
# 所以填「年份的父级」，如库结构为 /资源/26/11/08/ 则这里写 /资源，
# 直接写到 /资源/26 会得到 /资源/26/26/11/08（年份重复）。
baidu_default_dir = "/来自电脑"
quark_default_dir = "/来自电脑"

[watch]
# 监控目录与目标映射（panup watch 使用）。每项字段：
#   local      本地目录（递归监控）
#   pan        网盘名：baidu / quark
#   remote_dir 网盘目标目录
#   date_dir   是否追加「年/月/日」子目录（默认 true，即 /同步/26/11/09）
#   doc        成功后写入的文档端列表（默认 ["feishu"]；写失败不影响上传）
# 示例：dirs = [{ local = "D:\\Drop", pan = "quark", remote_dir = "/同步", date_dir = true, doc = ["feishu"] }]
dirs = []
# 轮询间隔（秒）
interval_seconds = 5
# 新文件稳定判定等待（秒）：大小两次采样不变即认为写完
stable_seconds = 10
# 单文件失败重试上限
retry_limit = 3

[feishu]
# 目标飞书文档 token（文档链接中 /docx/ 后那串）；应用凭证放 secrets/feishu_app.json
doc_token = ""

[web]
# 本地管理台端口（I-007；服务只监听 127.0.0.1，host 不可配置）
port = 8256

[log]
# 日志目录与保留天数
dir = "logs"
retention_days = 30
